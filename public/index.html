<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>秘密基地</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh; /* 强制高度为浏览器可视窗口的 100% */
            background-color: #000;
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace; 
            color: #fff;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* 使用绝对定位强制居中，这是最稳的居中方式 */
        .glitch-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%; /* 确保在极窄屏幕下能正常缩放 */
            padding: 0 5vw;
            box-sizing: border-box;
        }

        .glitch {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: bold;
            position: relative;
            color: #fff;
            white-space: nowrap; 
            
            text-shadow: 0.05em 0 0 rgba(255, 0, 81, 0.75),
                         -0.025em -0.05em 0 rgba(0, 255, 255, 0.75),
                         0.025em 0.05em 0 rgba(255, 255, 0, 0.75);
            animation: glitch-anim 500ms infinite; 
        }

        .glitch::before {
            content: attr(data-text); 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #00ffff;
            opacity: 0.8;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%); 
            animation: glitch-anim-1 400ms infinite linear alternate-reverse;
            transform: translate(-0.025em, -0.0125em);
        }

        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #ff00ff;
            opacity: 0.8;
            clip-path: polygon(0 80%, 100% 20%, 100% 100%, 0 100%);
            animation: glitch-anim-2 300ms infinite linear alternate-reverse;
            transform: translate(0.025em, 0.0125em);
        }

        @keyframes glitch-anim {
            0% { text-shadow: 0.05em 0 0 rgba(255, 0, 81, 0.75), -0.025em -0.05em 0 rgba(0, 255, 255, 0.75), 0.025em 0.05em 0 rgba(255, 255, 0, 0.75); }
            14% { text-shadow: 0.05em 0 0 rgba(255, 0, 81, 0.75), -0.025em -0.05em 0 rgba(0, 255, 255, 0.75), 0.025em 0.05em 0 rgba(255, 255, 0, 0.75); }
            15% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 81, 0.75), 0.025em 0.025em 0 rgba(0, 255, 255, 0.75), -0.05em -0.05em 0 rgba(255, 255, 0, 0.75); }
            49% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 81, 0.75), 0.025em 0.025em 0 rgba(0, 255, 255, 0.75), -0.05em -0.05em 0 rgba(255, 255, 0, 0.75); }
            50% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 81, 0.75), 0.05em 0 0 rgba(0, 255, 255, 0.75), 0 -0.05em 0 rgba(255, 255, 0, 0.75); }
            99% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 81, 0.75), 0.05em 0 0 rgba(0, 255, 255, 0.75), 0 -0.05em 0 rgba(255, 255, 0, 0.75); }
            100% { text-shadow: -0.025em 0 0 rgba(255, 0, 81, 0.75), -0.025em -0.025em 0 rgba(0, 255, 255, 0.75), -0.025em -0.05em 0 rgba(255, 255, 0, 0.75); }
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: polygon(0 15%, 100% 15%, 100% 16%, 0 16%); }
            10% { clip-path: polygon(0 10%, 100% 10%, 100% 11%, 0 11%); }
            20% { clip-path: polygon(0 90%, 100% 90%, 100% 91%, 0 91%); }
            30% { clip-path: polygon(0 60%, 100% 60%, 100% 61%, 0 61%); }
            100% { clip-path: polygon(0 10%, 100% 10%, 100% 11%, 0 11%); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: polygon(0 80%, 100% 80%, 100% 81%, 0 81%); }
            20% { clip-path: polygon(0 20%, 100% 20%, 100% 21%, 0 21%); }
            40% { clip-path: polygon(0 50%, 100% 50%, 100% 51%, 0 51%); }
            100% { clip-path: polygon(0 80%, 100% 80%, 100% 81%, 0 81%); }
        }
    </style>
</head>
<body>
    <div class="glitch-wrapper">
        <div class="glitch" data-text="看什么看，呆瓜">看什么看，呆瓜</div>
    </div>
</body>
</html>
